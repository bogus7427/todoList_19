<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>하루 한 줄 — 할 일 목록</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./app.js" defer></script>
    <script src="./weather.js" defer></script>
  </head>
  <body>
    <main class="notebook">
      <header>
        <div class="title-row">
          <h1><span id="title-owner">나의</span> 작은 기록<span>.</span></h1>
          <label class="sr-only" for="name-input">이름</label>
          <input
            id="name-input"
            class="name-input"
            type="text"
            placeholder="이름"
            maxlength="20"
            autocomplete="name"
          />
          <button
            id="name-edit-button"
            class="text-button name-edit-button"
            type="button"
            aria-label="이름 수정"
            hidden
          >
            수정
          </button>
        </div>
        <p class="subtitle">작은 할 일부터, 하나씩 가볍게.</p>
        <div class="weather">
          <a
            class="weather-attribution"
            href="https://open-meteo.com/"
            target="_blank"
            rel="noreferrer"
          >
            Weather data by Open-Meteo.com
          </a>
        </div>
      </header>
      <section class="current-weather" aria-labelledby="current-weather-title">
        <h2 id="current-weather-title">현재 날씨</h2>
        <p id="weather-status" role="status" aria-live="polite">
          현재 위치의 날씨를 불러오는 중이에요...
        </p>
      </section>

      <section aria-labelledby="list-title">
        <div class="section-heading">
          <h2 id="list-title">오늘의 할 일</h2>
          <span id="todo-count">0개 남음</span>
        </div>

        <form id="todo-form">
          <label class="sr-only" for="todo-input">새로운 할 일</label>
          <input
            id="todo-input"
            type="text"
            placeholder="어떤 일을 해볼까요?"
            maxlength="100"
            required
            autocomplete="off"
          />
          <button class="primary-button" type="submit">추가</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>

        <ul id="todo-list"></ul>
        <div id="empty-state">
          <span class="empty-mark" aria-hidden="true">✓</span>
          <p>아직 비어 있는 한 페이지</p>
          <p>첫 번째 할 일을 적어보세요.</p>
        </div>
      </section>

      <footer>
        <span class="save-dot" aria-hidden="true"></span>Copyright 2026. kenjo
        All rights reserved.
      </footer>
    </main>
  </body>
</html>
